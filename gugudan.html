<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>구구단</h1>
    <script>
        for (let dan = 2; dan <= 9; dan++) {
            document.write("<b>" + dan + "단</b><br>");
            for (let j = 1; j <= 9; j++) {
                document.write(dan + ' x ' + j + ' = ' + (dan * j) + '<br>');
            }
            
            document.write('<br>');
        }
    </script>
</body>    
</html>

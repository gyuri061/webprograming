<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>

//팝업 대화상자
alert('Hello, World!');
// 선택 팝업 대화상자 : 사용자의 선택이 sel이라는 변수에 담김.
let sel = confirm('정말 삭제하시겠습니까?');
// 입력창 : 사용자 입력 값을 반환값으로 받음. 
let input = prompt('이름을 입력하세요.');
</script>

<body>
    <h1>HELLOOOOOOO</h1>
    <script>
        document.write('<h2>JS 입출력 방법</h2>');
    </script>
    당신의 이름은
    <script>
        document.write(input);
    </script>
    입니다.
</body>
</html>
